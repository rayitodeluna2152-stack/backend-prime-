<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <style>
        body {
            background: linear-gradient(135deg, #ff7b00, #ff9a3c);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            text-align: center;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input, button {
            display: block;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            width: 220px;
            border-radius: 6px;
            border: none;
        }

        input {
            background: #ffffff;
        }

        button {
            background: #ff7b00;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff9a3c;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2 style="color:white;">Escribe tu nombre para entrar</h2>
    <input id="nombre" placeholder="Tu nombre">
    <button onclick="entrar()">Entrar</button>
</div>

<script>
function entrar() {
    const nombre = document.getElementById("nombre").value.trim();

    if (!nombre) {
        alert("Pon un nombre bro");
        return;
    }

    // ===============================
    // 🔥 LIMPIAR ESTADO ANTERIOR
    // ===============================
    localStorage.clear();

    // ===============================
    // 🔥 CREAR ID REAL DEL USUARIO
    // ===============================
    const id = "USER-" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("usuarioID", id);

    // ===============================
    // 🔥 GUARDAR NOMBRE (solo visual)
    // ===============================
    localStorage.setItem("nombreVisible", nombre);

    // ===============================
    // 🔥 MODO CREADOR (premium infinito)
    // ===============================
    if (nombre === "CREADOR-999") {
        localStorage.setItem("modoCreador", "true");
        localStorage.setItem(id + "_premiumActivo", "true");
        localStorage.setItem(id + "_premiumFin", 9999999999999);
    }

    // ===============================
    // ❌ NO activar prueba automáticamente
    // ===============================

    // ===============================
    // 🔥 IR AL HOME
    // ===============================
    location.href = "index.html";
}
</script>

</body>
</html>
