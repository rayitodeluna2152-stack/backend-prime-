<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesor de Productividad</title>

    <style>
        body {
            margin: 0;
            font-family: 'SF Pro Display', Arial;
            background: radial-gradient(circle at top, #1a1a1a, #000000);
            color: white;
            padding: 40px;
        }

        a {
            color: #00c6ff;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 30px;
        }

        .chat-container {
            max-width: 700px;
            margin: auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(0, 140, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            height: 500px;
            overflow-y: auto;
        }

        .msg {
            padding: 12px 18px;
            margin: 12px 0;
            border-radius: 15px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
            line-height: 1.4;
        }

        .user {
            background: rgba(0, 140, 255, 0.25);
            margin-left: auto;
            border: 1px solid rgba(0, 140, 255, 0.4);
        }

        .bot {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            max-width: 700px;
            margin: 25px auto 0;
            display: flex;
            gap: 10px;
        }

        #input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #send {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #007aff, #00c6ff);
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        #send:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <a href="profesores.html">← Volver a profesores</a>

    <h1>🔥 Profesor de Productividad</h1>
    <p>Pregúntame sobre hábitos, estudio, organización, motivación y cómo rendir al máximo.</p>

    <div class="chat-container" id="chat"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Escribe tu pregunta...">
        <button id="send">Enviar</button>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const send = document.getElementById("send");

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "msg " + type;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        send.onclick = async () => {
            const mensaje = input.value.trim();
            if (!mensaje) return;

            addMessage(mensaje, "user");
            input.value = "";

            try {
                const res = await fetch("https://loving-reprieve-production.up.railway.app/api/ia", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mensaje })
                });

                const data = await res.json();
                addMessage(data.respuesta || "Error en la IA", "bot");
            } catch (err) {
                addMessage("Error al hablar con el profesor. Inténtalo de nuevo.", "bot");
            }
        };
    </script>

</body>
</html>
