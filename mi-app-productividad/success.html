<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago completado</title>
    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        h1 {
            color: #4CAF50;
            font-size: 40px;
        }
        p {
            font-size: 20px;
            color: #333;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>¡Pago completado!</h1>
    <p>Tu suscripción premium ya está activa.</p>

    <a class="btn" href="index.html">Volver a la página principal</a>

    <script>
        // ============================
        // 🔥 ACTIVAR PREMIUM REAL
        // ============================

        const id = localStorage.getItem("usuarioID");

        if (!id) {
            alert("Debes iniciar sesión.");
            location.href = "login.html";
        }

        // Fecha actual
        const inicio = Date.now();

        // 30 días de premium
        const fin = inicio + (30 * 24 * 60 * 60 * 1000);

        // Guardar premium mensual
        localStorage.setItem(id + "_premiumActivo", "true");
        localStorage.setItem(id + "_premiumInicio", String(inicio));
        localStorage.setItem(id + "_premiumFin", String(fin));

        // Si tenía prueba → se desactiva
        localStorage.removeItem(id + "_pruebaActiva");

        console.log("🔥 PREMIUM ACTIVADO PARA:", id);
    </script>

</body>
</html>
